<style>
:root{--bg:#ECF1EE;--surface:#fff;--ink:#13201B;--muted:#56675F;--line:#D2DCD7;--accent:#0D6A72;--accent-ink:#fff;--r:#CF2229}
@media (prefers-color-scheme:dark){:root{--bg:#0C1311;--surface:#141D1A;--ink:#E2EBE6;--muted:#8FA199;--line:#26342E;--accent:#4CB2BA;--accent-ink:#04201F;--r:#EF5B60;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
form{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:grid;gap:14px}
h1{margin:0;font-size:22px}
p{margin:0;color:var(--muted);font-size:14px}
label{font-size:13px;font-weight:600;color:var(--muted);display:grid;gap:4px}
input[type=password]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;width:100%}
.chk{display:flex;align-items:center;gap:8px;font-weight:400;font-size:14px;color:var(--ink)}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:11px 14px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
button:disabled{opacity:.6}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#err{color:var(--r)}
[hidden]{display:none!important}
</style>
</head>

</form>

<script>
