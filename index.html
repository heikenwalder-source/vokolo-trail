<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0D6A72">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Trénink Vokolo Trail</title>
<meta name="robots" content="noindex,nofollow">

<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 24'%3E%3Crect width='32' height='24' rx='3' fill='%23fff'/%3E%3Crect y='8' width='32' height='8' fill='%23CF2229'/%3E%3C/svg%3E">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: one-column phone app, bottom tab bar; phases marked with Czech KČT trail markers (green, blue, red, yellow). */
:root{
  --bg:#ECF1EE; --surface:#FFFFFF; --surface-2:#F3F6F4; --ink:#13201B; --muted:#56675F; --line:#D2DCD7;
  --accent:#0D6A72; --accent-ink:#FFFFFF; --accent-soft:#D6EBEC;
  --g:#1C8A3B; --b:#1C5DB3; --r:#CF2229; --y:#D9A800; --mw:#FFFFFF; --ok:#1C8A3B;
  --font-d:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --font-b:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1311; --surface:#141D1A; --surface-2:#1A2521; --ink:#E2EBE6; --muted:#8FA199; --line:#26342E;
    --accent:#4CB2BA; --accent-ink:#04201F; --accent-soft:#15312F;
    --g:#43B266; --b:#5E92E3; --r:#EF5B60; --y:#EEC64A; --mw:#EEF2F0; --ok:#43B266;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1311; --surface:#141D1A; --surface-2:#1A2521; --ink:#E2EBE6; --muted:#8FA199; --line:#26342E;
  --accent:#4CB2BA; --accent-ink:#04201F; --accent-soft:#15312F;
  --g:#43B266; --b:#5E92E3; --r:#EF5B60; --y:#EEC64A; --mw:#EEF2F0; --ok:#43B266;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-b); font-size:15px; line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:14px calc(92px + env(safe-area-inset-bottom, 0px));
}
button{font:inherit; color:inherit}
button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.app{max-width:560px; margin:0 auto}
.view{display:grid; gap:14px}
h1,h2,h3{font-family:var(--font-d); text-wrap:balance; margin:0; letter-spacing:.01em}
h1{font-size:30px; font-weight:700; line-height:1.05}
h2{font-size:20px; font-weight:600; line-height:1.15}
h3{font-size:17px; font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--font-d); font-weight:600; font-size:13px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; display:grid; gap:12px; min-width:0}
.row{display:flex; align-items:center; gap:10px; min-width:0}
.between{justify-content:space-between}
.num-tab{font-variant-numeric:tabular-nums}

/* KČT marker */
.znacka{display:inline-block; width:22px; height:16px; flex:none; border-radius:2px; border:1px solid var(--line);
  background:linear-gradient(to bottom, var(--mw) 0 33%, var(--c) 33% 67%, var(--mw) 67% 100%)}
.znacka.cil{background:var(--mw); position:relative}
.znacka.cil::after{content:""; position:absolute; left:50%; top:50%; width:9px; height:9px; border-radius:50%; background:var(--c); transform:translate(-50%,-50%)}

/* Hero */
.hero{display:grid; gap:6px; padding-top:4px}
.count{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
.count .num{font-family:var(--font-d); font-weight:700; font-size:clamp(56px, 17vw, 80px); line-height:.9; font-variant-numeric:tabular-nums; letter-spacing:-.01em}
.count .unit{font-family:var(--font-d); font-weight:600; font-size:22px; color:var(--muted)}
.profile{position:relative; height:54px; margin-top:6px}
.profile svg{position:absolute; inset:0; width:100%; height:100%; display:block; overflow:visible}
.profile .dot{position:absolute; width:12px; height:12px; border-radius:50%; background:var(--accent); border:2px solid var(--bg); transform:translate(-50%, 50%)}
.profile-cap{display:flex; justify-content:space-between; font-size:12px; color:var(--muted)}
.phase-line{display:flex; align-items:center; gap:10px; font-weight:500}
.focus{color:var(--muted); max-width:62ch}

/* Session rows */
.list{display:grid; gap:8px}
.srow{display:flex; align-items:center; gap:10px; min-width:0}
.check{flex:none; width:34px; height:34px; border-radius:50%; border:2px solid var(--line); background:var(--surface); display:grid; place-items:center; cursor:pointer; color:transparent; padding:0}
.check svg{width:18px; height:18px}
.srow.is-done .check{background:var(--ok); border-color:var(--ok); color:#fff}
.sopen{flex:1; min-width:0; text-align:left; background:none; border:0; padding:4px 0; cursor:pointer; display:grid; gap:1px}
.stitle{font-weight:600; overflow-wrap:anywhere}
.srow.is-done .stitle{color:var(--muted); text-decoration:line-through; text-decoration-thickness:1px}
.smeta{font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums}
.tag{display:inline-block; font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; padding:1px 6px; border-radius:4px; background:var(--accent-soft); color:var(--accent); margin-left:6px; vertical-align:1px}
.smove{display:flex; gap:4px; flex:none}
.smove button{width:32px; height:32px; border-radius:8px; border:1px solid var(--line); background:var(--surface-2); cursor:pointer; font-size:18px; line-height:1; padding:0}
.smove button:disabled{opacity:.35; cursor:default}

/* Chips & buttons */
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{border:1px solid var(--line); background:var(--surface-2); border-radius:999px; padding:7px 14px; cursor:pointer; font-weight:500; font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn{border:1px solid var(--line); background:var(--surface-2); border-radius:10px; padding:9px 14px; cursor:pointer; font-weight:600; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:6px; color:var(--ink)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn.danger{border-color:var(--r); color:var(--r); background:transparent}
.btn.ghost{background:transparent}
.btns{display:flex; flex-wrap:wrap; gap:8px}

/* Recommendation */
.rec{display:grid; gap:10px; border-top:1px solid var(--line); padding-top:12px}
.rec-main{display:grid; gap:4px}
.rec-title{font-family:var(--font-d); font-size:24px; font-weight:700; line-height:1.05}
.rec-why{color:var(--muted)}
.rec-alts{display:grid; gap:6px}
.alt{display:flex; justify-content:space-between; gap:10px; align-items:center; text-align:left; background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:9px 12px; cursor:pointer}
.alt span:last-child{color:var(--muted); font-size:13px; white-space:nowrap}

/* Progress segments */
.segs{display:flex; gap:3px}
.seg{flex:1; height:8px; border-radius:2px; background:var(--line)}
.seg.on{background:var(--c, var(--ok))}
.prog-text{font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums}

/* Week view */
.weeknav{display:flex; align-items:center; gap:10px}
.weeknav .mid{flex:1; min-width:0; text-align:center}
.navbtn{width:40px; height:40px; border-radius:10px; border:1px solid var(--line); background:var(--surface); cursor:pointer; font-size:22px; line-height:1; flex:none}
.navbtn:disabled{opacity:.35}
.seg-ctl{display:grid; grid-template-columns:repeat(3,1fr); border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--surface-2)}
.seg-ctl button{border:0; background:transparent; padding:8px 4px; cursor:pointer; font-size:13px; font-weight:600; color:var(--muted)}
.seg-ctl button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:inset 0 -2px 0 var(--accent)}
.days{display:grid; gap:0}
.day{display:grid; grid-template-columns:52px 1fr; gap:10px; padding:10px 0; border-top:1px solid var(--line)}
.day:first-child{border-top:0}
.dlabel{font-family:var(--font-d); font-weight:600; line-height:1.1}
.dlabel b{display:block; font-size:20px}
.dlabel span{font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums}
.day.is-today .dlabel b{color:var(--accent)}
.free{color:var(--muted); font-size:14px; padding:7px 0}
.notes{display:grid; gap:6px; margin:0; padding:0; list-style:none}
.notes li{padding-left:14px; position:relative; color:var(--ink)}
.notes li::before{content:""; position:absolute; left:0; top:.6em; width:6px; height:6px; border-radius:50%; background:var(--accent)}

/* Plan view */
.chart{display:grid; gap:2px; align-items:end; height:150px; grid-template-rows:150px}
.bar{height:var(--h); background:var(--c); border:0; border-radius:3px 3px 0 0; position:relative; cursor:pointer; padding:0; min-width:0; opacity:.9}
.bar.is-min{opacity:.35}
.bar.is-now{outline:2px solid var(--ink); outline-offset:1px; opacity:1}
.bar .bv{position:absolute; bottom:100%; left:50%; transform:translateX(-50%); font-family:var(--font-d); font-size:11px; font-weight:600; color:var(--muted); padding-bottom:2px; font-variant-numeric:tabular-nums}
.chart-x{display:grid; gap:2px; font-size:11px; color:var(--muted); border-top:1px solid var(--line); padding-top:4px}
.chart-x span{white-space:nowrap; overflow:visible}
.legend{display:flex; flex-wrap:wrap; gap:8px 16px; font-size:13px; color:var(--muted)}
.legend span{display:inline-flex; align-items:center; gap:6px}
.weeks{list-style:none; margin:0; padding:0; display:grid}
.wrow{display:grid; grid-template-columns:24px 1fr auto; gap:10px; align-items:center; width:100%; text-align:left; background:none; border:0; border-top:1px solid var(--line); padding:10px 2px; cursor:pointer}
.weeks li:first-child .wrow{border-top:0}
.wrow.is-now{background:var(--accent-soft); border-radius:8px; border-top-color:transparent}
.wrow .w1{font-weight:600; font-variant-numeric:tabular-nums}
.wrow .w2{font-size:13px; color:var(--muted)}
.wrow .w3{font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums; text-align:right}

/* Food */
.food ul{margin:0; padding-left:18px; display:grid; gap:6px}
.food li{max-width:62ch}
.hint{background:var(--accent-soft); border-color:transparent}
.hint .eyebrow{color:var(--accent)}

/* Settings */
.form{display:grid; gap:12px}
.field{display:grid; gap:4px}
.field label{font-size:13px; font-weight:600; color:var(--muted)}
.field input, .field select{font:inherit; color:var(--ink); background:var(--surface-2); border:1px solid var(--line); border-radius:8px; padding:9px 10px; width:100%; min-width:0}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
@media (max-width:380px){ .grid2{grid-template-columns:1fr} }
.sync{display:flex; align-items:center; gap:8px; font-size:14px}
.sync i{width:9px; height:9px; border-radius:50%; background:var(--muted); flex:none}
.sync.ok i{background:var(--ok)}
.sync.warn i{background:var(--y)}

/* Tabs */
.tabs{position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--surface); border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom, 0px); padding-left:max(6px, env(safe-area-inset-left, 0px)); padding-right:max(6px, env(safe-area-inset-right, 0px))}
.tabs-in{max-width:560px; margin:0 auto; display:grid; grid-template-columns:repeat(5,1fr)}
.tab{display:grid; justify-items:center; gap:2px; padding:8px 2px 9px; background:none; border:0; cursor:pointer; color:var(--muted); font-size:12px; font-weight:600; text-decoration:none}
.tab svg{width:24px; height:24px}
.tab[aria-current="page"]{color:var(--accent)}

/* Sheet */
.scrim{position:fixed; inset:0; background:rgba(5,12,10,.45); z-index:30}
.sheet{position:fixed; left:0; right:0; bottom:0; z-index:31; max-height:88%; overflow:auto; background:var(--surface); border-radius:16px 16px 0 0; border-top:1px solid var(--line);
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-bottom:calc(20px + env(safe-area-inset-bottom, 0px))}
.sheet-in{max-width:560px; margin:0 auto; display:grid; gap:14px; padding-top:10px}
.grab{width:40px; height:4px; border-radius:2px; background:var(--line); margin:0 auto}
.sheet-head{display:flex; align-items:flex-start; gap:10px}
.sheet-head h2{font-size:26px; flex:1}
.x{width:36px; height:36px; border-radius:50%; border:1px solid var(--line); background:var(--surface-2); cursor:pointer; font-size:18px; flex:none}
.steps{margin:0; padding-left:20px; display:grid; gap:6px}
.ex{list-style:none; margin:0; padding:0; display:grid; gap:10px}
.ex li{display:grid; gap:2px; border-left:3px solid var(--accent-soft); padding-left:10px}
.ex .exn{display:flex; justify-content:space-between; gap:10px; font-weight:600}
.ex .exn span{font-variant-numeric:tabular-nums; color:var(--accent); white-space:nowrap}
.ex .exh{font-size:14px; color:var(--muted)}
.tips{display:grid; gap:6px; font-size:14px; color:var(--muted)}
.sublabel{font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.daypick{display:grid; grid-template-columns:repeat(7,1fr); gap:4px}
.daypick button{border:1px solid var(--line); background:var(--surface-2); border-radius:8px; padding:6px 0; cursor:pointer; display:grid; line-height:1.1; font-weight:600}
.daypick button small{font-weight:400; font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums}
.daypick button[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.daypick button[aria-pressed="true"] small{color:var(--accent-ink)}
.time{font:inherit; color:var(--ink); background:var(--surface-2); border:1px solid var(--line); border-radius:8px; padding:8px 10px}

.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(76px + env(safe-area-inset-bottom, 0px)); z-index:40; background:var(--ink); color:var(--bg); padding:9px 16px; border-radius:999px; font-weight:600; font-size:14px; max-width:calc(100% - 32px)}

@media (prefers-reduced-motion: no-preference){
  .sheet:not([hidden]){animation:up .18s ease-out}
  @keyframes up{from{transform:translateY(24px); opacity:.6} to{transform:none; opacity:1}}
}
</style>

<div class="app">
  <main>
    <section class="view" id="v-dnes" aria-label="Dnes"></section>
    <section class="view" id="v-tyden" aria-label="Týden" hidden></section>
    <section class="view" id="v-plan" aria-label="Plán" hidden></section>
    <section class="view" id="v-strava" aria-label="Strava" hidden></section>
    <section class="view" id="v-nastaveni" aria-label="Nastavení" hidden></section>
  </main>
</div>

<nav class="tabs" aria-label="Hlavní menu">

    <a class="tab" href="#plan" data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 19.5l5.5-9 4 5.5 3-4 6.5 7.5z"/><path d="M15 5.5v4M15 5.5h4l-1 1.2 1 1.3h-4"/></svg>Plán</a>

  </div>
</nav>

<script>
(function(){
'use strict';

/* ---------- Dates ---------- */
var DAY = 86400000;
function pd(s){ var p = String(s).split('-').map(Number); return Math.round(Date.UTC(p[0], p[1]-1, p[2]) / DAY); }
function iso(n){ return new Date(n*DAY).toISOString().slice(0,10); }
function today(){ var n = new Date(); return Math.round(Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()) / DAY); }
function dow(n){ return (new Date(n*DAY).getUTCDay() + 6) % 7; }
function mon(n){ return n - dow(n); }
function dm(n){ var d = new Date(n*DAY); return d.getUTCDate() + '. ' + (d.getUTCMonth()+1) + '.'; }
function dmy(n){ return dm(n) + ' ' + new Date(n*DAY).getUTCFullYear(); }
function mod7(x){ return ((x % 7) + 7) % 7; }
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function pl(n, a, b, c){ n = Math.abs(n); return n === 1 ? a : (n >= 2 && n <= 4) ? b : c; }
function fmtMin(m){ m = Math.round(m); if (m < 60) return m + ' min'; var h = Math.floor(m/60), r = m % 60; return h + ' h' + (r ? ' ' + r + ' min' : ''); }
function fmtPace(p){ var m = Math.floor(p), s = Math.round((p - m) * 60); if (s === 60){ m++; s = 0; } return m + ':' + String(s).padStart(2,'0'); }
function parsePace(s){ var m = String(s).trim().match(/^(\d{1,2})(?:[:.,](\d{1,2}))?$/); if (!m) return NaN; return Number(m[1]) + (m[2] ? Number(m[2].padEnd(2,'0'))/60 : 0); }

var DS = ['Po','Út','St','Čt','Pá','So','Ne'];
var DL = ['pondělí','úterý','středa','čtvrtek','pátek','sobota','neděle'];
var DACC = ['v pondělí','v úterý','ve středu','ve čtvrtek','v pátek','v sobotu','v neděli'];
var DGEN = ['z pondělí','z úterý','ze středy','ze čtvrtka','z pátku','ze soboty','z neděle'];
var MS = ['led','úno','bře','dub','kvě','čvn','čvc','srp','zář','říj','lis','pro'];

/* ---------- State ---------- */
var LS_KEY = 'trenink-priglu-v1';
var DEFAULT_CONFIG = { raceName:'Vokolo Trail', raceDate:'2027-04-17', raceKm:18, planStart:'2026-11-16', longDay:4, runsPerWeek:3, startLong:10, pace:7 };
function freshState(){ return { v:1, config:Object.assign({}, DEFAULT_CONFIG), done:{}, moves:{}, modes:{'2027-02-01':'hold','2027-02-08':'hold'}, extras:[], updatedAt:'' }; }
function fixName(c){ if (c.raceName === 'Vokolo Příglu') c.raceName = 'Vokolo Trail'; return c; }
function mergeState(s){
  var f = freshState();
  if (!s || typeof s !== 'object') return f;

var docRef = null, sync = 'local', writing = false, again = false, wTimer = null;

    var c = e && e.code;

    else { sync = 'error'; }

}
function connect(){

  sync = 'connecting';
  window.claude.use('db').then(function(db){
    if (!db){ sync = 'local'; renderSync(); return; }
    docRef = db.doc('trenink/stav');
    var timer = setTimeout(function(){ if (sync === 'connecting'){ sync = 'offline'; renderSync(); } }, 10000);
    docRef.onSnapshot(function(snap){
      if (!snap.metadata.fromCache){ clearTimeout(timer); sync = 'synced'; }
      if (snap.metadata.hasPendingWrites){ renderSync(); return; }
      if (!snap.exists){ if (hasUserData(state)) { clearTimeout(wTimer); wTimer = setTimeout(flush, 300); } renderSync(); return; }
      var remote = snap.data() || {};

        if (r) { renderAll(); if (current === 'nastaveni') renderSettings(); }
      } else { clearTimeout(wTimer); wTimer = setTimeout(flush, 300); }

}

var TYPES = {

  }

  var ramp = weeks.filter(function(x){ return x.wtr >= 4 && !x.recovery; });
  ramp.forEach(function(x, k){ x.ramp = sl + (peakPre - sl) * (ramp.length > 1 ? k / (ramp.length - 1) : 1); });

    w.longType = 'long';
    if (w.wtr === 0) w.long = rk;
    else if (w.wtr === 3){ peak = Math.min(rk, Math.max(last, sl) + 3); w.long = peak; }
    else if (w.wtr === 2) w.long = Math.round(peak * 0.8);
    else if (w.wtr === 1) w.long = Math.round(peak * 0.55);
    else if (w.recovery){ w.long = Math.max(6, Math.round(Math.max(last, sl) * 0.8)); if (w.phase === 'base'){ w.longType = 'mid'; w.midKm = w.long; } }

    '<div class="btns">' + (resetArmed ? '<button class="btn danger" data-act="resetgo">Ano, smazat záznamy</button><button class="btn ghost" data-act="resetno">Zpět</button>' : '<button class="btn danger" data-act="reset">Smazat odškrtnutí a přesuny</button>') + '</div></section>';
  h += '<section class="card"><h2>Jak plán funguje</h2><p class="focus">Plán se počítá od data závodu dozadu ve fázích Udržet, Stavět, Vrchol, Ladit a Závod. Dlouhý běh roste nejvýš o kilometr za týden a každý čtvrtý týden je odpočinkový. Tři týdny před závodem přijde nejdelší běh, pak se ubírá.</p>' +
    '<p class="focus">Barvy fází jsou turistické značky. Režim týdne „Minimum“ se hodí na cesty a nemoc, „Bez navyšování“ na náročné týdny v práci.</p></section>';
  $('#v-nastaveni').innerHTML = h;
}

/* ---------- Sheet ---------- */
var sheetId = null;
function findAny(id){ if (id.indexOf('x:') === 0){ var ex = state.extras.filter(function(x){ return x.id === id; })[0]; if (ex) return Object.assign(extraDef(ex.type, ex.minutes), { id:ex.id, extra:true, date:ex.date, minutes:ex.minutes, feel:ex.feel }); return recCache[id] || null; } return findPlanned(id); }
function inArtifact(){ return !!(window.claude && typeof window.claude.use === 'function'); }
var DEF_TIME = { long:'09:00', mid:'09:00', race:'09:00', run:'06:30', strength:'06:00', mobility:'21:00' };
function timeKey(s){ return (s.type === 'long' || s.type === 'mid' || s.type === 'race') ? s.type : s.cat; }
function calTimes(abs, hhmm, minutes){
  var p = hhmm.split(':').map(Number), d = new Date(abs * DAY);
  var a = new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate(), p[0] || 0, p[1] || 0), b = new Date(a.getTime() + (minutes || 30) * 60000);
  return [a, b];
}
function detailsText(s){
  var L = [s.why || ''];
  if (s.intro) L.push(s.intro);
  if (s.steps) L = L.concat(s.steps.map(function(x){ return '- ' + x; }));
  if (s.ex) L = L.concat(s.ex.map(function(e){ return '- ' + EX[e[0]][0] + ': ' + e[1]; }));
  return L.join('\n');
}
function calLinks(s, abs, hhmm){
  var tt = calTimes(abs, hhmm, s.minutes), e = encodeURIComponent, det = detailsText(s);
  var g = function(x){ return x.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, ''); };
  var o = function(x){ return x.toISOString().replace(/\.\d{3}/, ''); };
  var ms = function(host){ return 'https://' + host + '/calendar/0/deeplink/compose?path=%2Fcalendar%2Faction%2Fcompose&rru=addevent&subject=' + e(s.title) + '&startdt=' + e(o(tt[0])) + '&enddt=' + e(o(tt[1])) + '&body=' + e(det); };
  return { google:'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + e(s.title) + '&dates=' + g(tt[0]) + '/' + g(tt[1]) + '&details=' + e(det),
    outlook:ms('outlook.live.com'), m365:ms('outlook.office.com') };
}
function icsDownload(s, abs, hhmm){
  var tt = calTimes(abs, hhmm, s.minutes), f = function(x){ return x.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, ''); };
  var q = function(x){ return String(x).replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/[,;]/g, function(c){ return '\\' + c; }); };
  var txt = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Trenink//CS','BEGIN:VEVENT','UID:' + s.id.replace(/[^a-z0-9]/gi, '') + '-' + Date.now() + '@trenink',
    'DTSTAMP:' + f(new Date()),'DTSTART:' + f(tt[0]),'DTEND:' + f(tt[1]),'SUMMARY:' + q(s.title),'DESCRIPTION:' + q(detailsText(s)),'END:VEVENT','END:VCALENDAR'].join('\r\n');
  var url = URL.createObjectURL(new Blob([txt], { type:'text/calendar' })), a = document.createElement('a');
  a.href = url; a.download = 'trenink.ics'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
}
function sheetAbs(s){ return s.extra || s.filler ? pd(s.date) : absOf(s); }
function renderSheet(){
  var s = sheetId && findAny(sheetId), el = $('#sheet');
  if (!s){ closeSheet(); return; }
  var abs = sheetAbs(s), done = s.extra || (!s.filler && !!state.done[s.id]), rec = state.done[s.id], feel = s.extra ? s.feel : rec && rec.feel;
  var w = s.filler || s.extra ? null : plan.weeks[s.wi], t = today(), h = '';
  h += '<div class="sheet-in" data-id="' + esc(s.id) + '"><div class="grab"></div><div class="sheet-head"><div style="flex:1; min-width:0"><p class="eyebrow">' + DL[dow(abs)] + ' ' + dm(abs) + (s.filler ? ' · navíc' : '') + '</p><h2 id="sheet-title">' + esc(s.title) + '</h2><p class="smeta">' + metaText(s) + '</p></div><button class="x" data-act="close" aria-label="Zavřít">✕</button></div>';
  if (s.why) h += '<p>' + esc(s.why) + '</p>';
  if (s.intro) h += '<p class="sublabel">' + esc(s.intro) + '</p>';
  if (s.steps) h += '<ol class="steps">' + s.steps.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ol>';
  if (s.ex) h += '<ul class="ex">' + s.ex.map(function(e){ return '<li><div class="exn">' + esc(EX[e[0]][0]) + '<span>' + esc(e[1]) + '</span></div><div class="exh">' + esc(EX[e[0]][1]) + '</div></li>'; }).join('') + '</ul>';
  if (s.tips && s.tips.length) h += '<div class="tips">' + s.tips.map(function(x){ return '<p>' + esc(x) + '</p>'; }).join('') + '</div>';
  h += '<div class="btns"><button class="btn' + (done ? '' : ' primary') + '" data-act="toggle">' + (done ? 'Zrušit hotovo' : 'Hotovo') + '</button>' + (!s.filler && !s.extra && w && t >= w.start && t < w.start + 7 && abs !== t ? '<button class="btn" data-act="totoday">Dát na dnes</button>' : '') + '</div>';
  if (done){
    h += '<div><p class="sublabel" style="margin-bottom:6px">Jak to šlo</p><div class="chips">' + [['lehke','Lehké'],['akorat','Akorát'],['tezke','Těžké']].map(function(f){ return '<button class="chip" data-act="feel" data-feel="' + f[0] + '" aria-pressed="' + (feel === f[0]) + '">' + f[1] + '</button>'; }).join('') + '</div></div>';
  }
  if (w){
    var cur = dayOf(s);
    h += '<div><p class="sublabel" style="margin-bottom:6px">Přesunout na</p><div class="daypick">' + DS.map(function(dn, i){ return '<button data-act="moveto" data-day="' + i + '" aria-pressed="' + (cur === i) + '">' + dn + '<small>' + dm(w.start + i) + '</small></button>'; }).join('') + '</div></div>';
  }
  var tk = timeKey(s), tm = pref('time:' + tk) || DEF_TIME[tk] || '07:00', L = calLinks(s, abs, tm);
  h += '<div><p class="sublabel" style="margin-bottom:6px">Do kalendáře</p><div class="btns" style="align-items:center"><label class="muted" for="cal-time" style="font-size:14px">Začátek</label><input class="time" id="cal-time" type="time" value="' + esc(tm) + '">' +
    '<a class="btn" id="cal-g" href="' + L.google + '" target="_blank" rel="noopener">Google</a><a class="btn" id="cal-o" href="' + L.outlook + '" target="_blank" rel="noopener">Outlook.com</a><a class="btn" id="cal-m" href="' + L.m365 + '" target="_blank" rel="noopener">Microsoft 365</a>' +
    (inArtifact() ? '' : '<button class="btn" data-act="ics">Soubor .ics</button>') + '</div></div>';
  h += '</div>';
  el.innerHTML = h;
}
function openSheet(id){ sheetId = id; renderSheet(); $('#scrim').hidden = false; $('#sheet').hidden = false; var x = $('#sheet .x'); if (x) x.focus(); }
function closeSheet(){ sheetId = null; $('#scrim').hidden = true; $('#sheet').hidden = true; }

/* ---------- Actions ---------- */
var toastT;
function toast(msg){ var t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(function(){ t.hidden = true; }, 1800); }
function toggleDone(id){
  if (id.indexOf('x:') === 0){
    var i = state.extras.findIndex(function(x){ return x.id === id; });
    if (i >= 0){ state.extras.splice(i, 1); toast('Odebráno'); }
    else { var f = recCache[id]; if (!f) return; state.extras.push({ id:id, date:f.date, type:f.type, minutes:f.minutes, at:new Date().toISOString() }); toast('Zapsáno jako navíc'); }
  } else {
    if (state.done[id]) delete state.done[id];
    else { state.done[id] = { at:new Date().toISOString() }; toast('Hotovo'); }
  }
  persist(); renderAll();
}
function moveTo(id, day){
  var s = findPlanned(id); if (!s) return;
  day = Math.max(0, Math.min(6, day));
  if (day === s.day) delete state.moves[id]; else state.moves[id] = day;
  persist(); renderAll();
}
document.addEventListener('click', function(ev){
  var b = ev.target.closest('[data-act]'); if (!b) return;
  var act = b.getAttribute('data-act'), host = b.closest('[data-id]'), id = b.getAttribute('data-id') || (host && host.getAttribute('data-id'));
  switch (act){
    case 'toggle': toggleDone(id); break;
    case 'open': openSheet(id); break;
    case 'close': closeSheet(); break;
    case 'move': { var s = findPlanned(id); if (s) moveTo(id, dayOf(s) + Number(b.getAttribute('data-dir'))); break; }
    case 'moveto': moveTo(id, Number(b.getAttribute('data-day'))); toast('Přesunuto na ' + DL[Number(b.getAttribute('data-day'))]); break;
    case 'totoday': { var s2 = findPlanned(id); if (s2){ moveTo(id, dow(today())); toast('Přesunuto na dnes'); } break; }
    case 'avail': lastAvail = Number(b.getAttribute('data-min')); renderToday(); var r = document.getElementById('rec'); if (r && r.scrollIntoView) r.scrollIntoView({ block:'nearest', behavior:'smooth' }); break;
    case 'goweek': ev.preventDefault(); viewWeek = Number(b.getAttribute('data-i')); closeSheet(); if (location.hash !== '#tyden') location.hash = 'tyden'; else renderWeek(); window.scrollTo(0, 0); break;
    case 'wprev': viewWeek--; renderWeek(); break;
    case 'wnext': viewWeek++; renderWeek(); break;
    case 'mode': { var w = plan.weeks[viewWeek], m = b.getAttribute('data-mode'); if (m === 'normal') delete state.modes[w.iso]; else state.modes[w.iso] = m; persist(); renderAll(); break; }
    case 'feel': { var f = b.getAttribute('data-feel');
      if (id.indexOf('x:') === 0){ var ex = state.extras.filter(function(x){ return x.id === id; })[0]; if (ex) ex.feel = ex.feel === f ? null : f; }
      else if (state.done[id]) state.done[id].feel = state.done[id].feel === f ? null : f;
      persist(); renderSheet(); break; }
    case 'ics': { var s3 = findAny(sheetId); if (s3) icsDownload(s3, sheetAbs(s3), $('#cal-time').value || '07:00'); break; }
    case 'cfgdefault': { var keep = state.config; state.config = Object.assign({}, DEFAULT_CONFIG); renderSettings(); state.config = keep; toast('Výchozí hodnoty doplněné, ulož je'); break; }
    case 'reset': resetArmed = true; renderSettings(); break;
    case 'resetno': resetArmed = false; renderSettings(); break;
    case 'resetgo': resetArmed = false; state.done = {}; state.moves = {}; state.extras = []; persist(); renderAll(); renderSettings(); toast('Záznamy smazané'); break;
  }
});
$('#scrim').addEventListener('click', closeSheet);
document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && sheetId) closeSheet(); });
document.addEventListener('input', function(e){
  if (e.target.id !== 'cal-time' || !sheetId) return;
  var s = findAny(sheetId); if (!s) return;
  var v = e.target.value || '07:00'; pref('time:' + timeKey(s), v);
  var L = calLinks(s, sheetAbs(s), v); $('#cal-g').href = L.google; $('#cal-o').href = L.outlook; $('#cal-m').href = L.m365;
});
document.addEventListener('submit', function(e){
  if (e.target.id !== 'cfg-form') return;
  e.preventDefault();
  var err = [], name = $('#cfg-name').value.trim() || DEFAULT_CONFIG.raceName, date = $('#cfg-date').value, km = Number($('#cfg-km').value),
    start = $('#cfg-start').value, ld = Number($('#cfg-long').value), runs = Number($('#cfg-runs').value), sl = Number($('#cfg-sl').value), pace = parsePace($('#cfg-pace').value);
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) err.push('Zadej datum závodu.');
  if (!/^\d{4}-\d{2}-\d{2}$/.test(start)) err.push('Zadej začátek plánu.');
  if (!err.length && pd(date) - pd(start) < 14) err.push('Závod musí být aspoň dva týdny po začátku plánu.');
  if (!(km >= 5 && km <= 60)) err.push('Délka závodu musí být mezi 5 a 60 km.');
  if (!(sl >= 3 && sl <= 40)) err.push('Úvodní dlouhý běh musí být mezi 3 a 40 km.');
  if (!(pace >= 4 && pace <= 10)) err.push('Tempo zadej jako minuty:sekundy, třeba 7:00.');
  var box = $('#cfg-err');
  if (err.length){ box.textContent = err.join(' '); box.hidden = false; return; }
  state.config = { raceName:name, raceDate:date, raceKm:Math.round(km), planStart:start, longDay:ld, runsPerWeek:runs, startLong:Math.round(sl), pace:pace };
  viewWeek = null; persist(); renderAll(); renderSettings(); toast('Uloženo, plán je přepočítaný');
});

/* ---------- Routing ---------- */
var TABS = ['dnes', 'tyden', 'plan', 'strava', 'nastaveni'];
function show(){
  var h = (location.hash || '').replace('#', '');
  current = TABS.indexOf(h) >= 0 ? h : 'dnes';
  TABS.forEach(function(t){ document.getElementById('v-' + t).hidden = t !== current; });
  document.querySelectorAll('.tab').forEach(function(a){ if (a.getAttribute('data-tab') === current) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  if (current === 'nastaveni') renderSettings();
  if (current === 'tyden') renderWeek();
}
window.addEventListener('hashchange', function(){ show(); window.scrollTo(0, 0); });

function renderAll(){
  plan = buildPlan();
  renderToday(); renderWeek(); renderPlan(); renderFood();
  if (sheetId) renderSheet();
}

renderAll(); show(); connect();
})();
</script>
